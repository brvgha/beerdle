steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/beerdle-frontend'
      - '--build-arg'
      - 'VITE_API_URL=$_VITE_API_URL'
      - '--build-arg'
      - 'VITE_API_KEY=$_VITE_API_KEY'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/beerdle-frontend']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'beerdle-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/beerdle-frontend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# To deploy with the API key, use:
# gcloud builds submit --substitution=_VITE_API_KEY="your-api-key-here"
# Or store the key in Secret Manager and reference it
substitutions:
  _VITE_API_URL: 'https://beerdle-api-final-713774466210.europe-west1.run.app'
  _VITE_API_KEY: ''  # Override this value when submitting the build

images:
  - 'gcr.io/$PROJECT_ID/beerdle-frontend'
