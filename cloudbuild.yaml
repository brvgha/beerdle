steps:
  - name: 'bash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -z "$VITE_API_KEY" ]; then
          echo "VITE_API_KEY IS EMPTY IN CLOUD BUILD"
        else
          echo "VITE_API_KEY IS PRESENT IN CLOUD BUILD"
        fi
    secretEnv: ['VITE_API_KEY']

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/beerdle-frontend'
      - '--build-arg'
      - 'VITE_API_URL=$VITE_API_URL'
      - '--build-arg'
      - 'VITE_API_KEY=$$VITE_API_KEY'
      - '.'
    secretEnv: ['VITE_API_KEY']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/beerdle-frontend']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'beerdle-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/beerdle-frontend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# Retrieve API key from Secret Manager
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/vite-api-key/versions/latest
    env: 'VITE_API_KEY'

substitutions:
  _VITE_API_URL: 'https://beerdle-api-final-713774466210.europe-west1.run.app'

images:
  - 'gcr.io/$PROJECT_ID/beerdle-frontend'
